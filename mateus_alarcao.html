<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estante — Catálogo de Jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #14121f;
  --bg-soft: #1a1728;
  --surface: #1e1b2e;
  --surface-2: #262239;
  --line: #33304a;
  --text: #f5f3fa;
  --muted: #9c97b5;
  --amber: #f2b84b;
  --pink: #ff5d8f;
  --mint: #5fe1c9;
  --radius: 14px;
  --font-display: "Sora", sans-serif;
  --font-body: "Inter", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}

*{ box-sizing: border-box; }

html{ scroll-behavior: smooth; }

body{
  margin: 0;
  background:
    radial-gradient(circle at 15% 0%, rgba(242,184,75,0.10), transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(255,93,143,0.10), transparent 45%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.5;
}

a{ color: inherit; }

/* ---------- Hero ---------- */
.hero{
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 12px;
}

.hero__top{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
}

.brand{
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  font-weight: 500;
  letter-spacing: 0.02em;
}

.brand__mark{
  color: var(--amber);
  letter-spacing: -2px;
}

.brand__count strong{
  color: var(--amber);
  font-weight: 500;
}

.hero__title{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(32px, 5vw, 52px);
  line-height: 1.08;
  margin: 0 0 14px;
  letter-spacing: -0.01em;
}

.hero__sub{
  color: var(--muted);
  max-width: 480px;
  margin: 0 0 28px;
  font-size: 15px;
}

/* ---------- Controls ---------- */
.controls{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}

.search{
  position: relative;
  flex: 1 1 260px;
}

.search__icon{
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  fill: none;
  stroke: var(--muted);
  stroke-width: 2;
  pointer-events: none;
}

.search input{
  width: 100%;
  padding: 12px 14px 12px 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  transition: border-color .15s ease, background .15s ease;
}

.search input::placeholder{ color: var(--muted); }

.search input:focus{
  border-color: var(--amber);
  background: var(--surface-2);
}

.select{
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  cursor: pointer;
}

.select:focus{ border-color: var(--amber); }

.chips{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}

.chip{
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 7px 13px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}

.chip:hover{ border-color: var(--amber); color: var(--text); }

.chip.active{
  background: var(--amber);
  border-color: var(--amber);
  color: #1a1400;
  font-weight: 500;
}

/* ---------- Result info ---------- */
main{
  max-width: 1120px;
  margin: 0 auto;
  padding: 4px 24px 60px;
}

.result-info{
  color: var(--muted);
  font-size: 13px;
  font-family: var(--font-mono);
  margin: 0 0 16px;
}

/* ---------- Grid & cards ---------- */
.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 20px;
}

.card{
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 18px 18px;
  cursor: pointer;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  transform-style: preserve-3d;
}

.card::before{
  /* cartridge notch */
  content: "";
  position: absolute;
  top: -1px;
  left: 22px;
  width: 34px;
  height: 10px;
  background: var(--card-color, var(--amber));
  border-radius: 0 0 6px 6px;
}

.card:hover{
  transform: translateY(-4px) rotate(-0.4deg);
  border-color: var(--card-color, var(--amber));
  box-shadow: 0 14px 28px -14px rgba(0,0,0,0.55);
}

.card__cover{
  height: 108px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  margin-bottom: 14px;
  background: linear-gradient(150deg, color-mix(in srgb, var(--card-color, var(--amber)) 35%, var(--surface)) , var(--surface-2));
}

.card__genre{
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--card-color, var(--amber));
  margin-bottom: 6px;
}

.card__title{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16.5px;
  margin: 0 0 8px;
  line-height: 1.25;
}

.card__meta{
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--muted);
}

.card__rating{
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text);
}

.card__rating svg{ width: 12px; height: 12px; fill: var(--amber); }

/* ---------- Empty state ---------- */
.empty{
  text-align: center;
  color: var(--muted);
  padding: 60px 20px;
  font-size: 14px;
}

.hidden{ display: none !important; }

.link-btn{
  background: none;
  border: none;
  color: var(--amber);
  text-decoration: underline;
  cursor: pointer;
  font: inherit;
  padding: 0;
}

/* ---------- Footer ---------- */
.footer{
  text-align: center;
  color: var(--muted);
  font-size: 12.5px;
  padding: 20px 24px 40px;
  border-top: 1px solid var(--line);
  max-width: 1120px;
  margin: 0 auto;
}

/* ---------- Modal ---------- */
.modal-overlay{
  position: fixed;
  inset: 0;
  background: rgba(10, 9, 16, 0.72);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 50;
}

.modal{
  position: relative;
  width: 100%;
  max-width: 460px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 28px 26px 26px;
  animation: pop .18s ease;
}

@keyframes pop{
  from{ opacity: 0; transform: scale(.97) translateY(6px); }
  to{ opacity: 1; transform: scale(1) translateY(0); }
}

.modal__close{
  position: absolute;
  top: 16px;
  right: 16px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
}

.modal__close:hover{ color: var(--text); border-color: var(--amber); }

.modal__cover{
  height: 130px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  margin-bottom: 18px;
  background: linear-gradient(150deg, color-mix(in srgb, var(--card-color, var(--amber)) 40%, var(--surface)), var(--surface-2));
}

.modal__genre{
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--card-color, var(--amber));
  margin-bottom: 8px;
}

.modal__title{
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 800;
  margin: 0 0 12px;
}

.modal__tags{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.modal__tag{
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 11px;
}

.modal__desc{
  color: var(--muted);
  font-size: 14px;
  margin: 0 0 18px;
}

.modal__footer{
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}

.modal__rating{
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}

.modal__rating svg{ width: 15px; height: 15px; fill: var(--amber); }

/* ---------- Responsive ---------- */
@media (max-width: 560px){
  .hero{ padding: 28px 18px 8px; }
  main{ padding: 4px 18px 50px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; }
}

</style>
</head>
<body>

  <header class="hero">
    <div class="hero__top">
      <span class="brand">
        <span class="brand__mark">▮▮</span> Estante
      </span>
      <span class="brand__count"><strong id="countTotal">0</strong> jogos na coleção</span>
    </div>

    <h1 class="hero__title">Sua coleção,<br>organizada por prateleira.</h1>
    <p class="hero__sub">Busque, filtre por gênero e plataforma, e abra um jogo pra ver os detalhes da caixinha.</p>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" class="search__icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar por título…" autocomplete="off">
      </div>

      <select id="platformSelect" class="select">
        <option value="all">Todas as plataformas</option>
      </select>

      <select id="sortSelect" class="select">
        <option value="title">Ordenar: A–Z</option>
        <option value="year-desc">Ordenar: mais recentes</option>
        <option value="rating-desc">Ordenar: melhor avaliados</option>
      </select>
    </div>

    <div id="genreChips" class="chips"></div>
  </header>

  <main>
    <div id="resultInfo" class="result-info"></div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="emptyState" class="empty hidden">Nenhum jogo encontrado com esses filtros. <button id="clearFilters" class="link-btn">Limpar filtros</button></p>
  </main>

  <footer class="footer">
    <p>Estante — catálogo estático, feito com HTML, CSS e JS puros.</p>
  </footer>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modalCard" class="modal" role="dialog" aria-modal="true">
      <button id="modalClose" class="modal__close" aria-label="Fechar">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

<script>
// ---------- Data ----------
const GAMES = [
  { id: 1,  title: "Ecos de Netherhall",   genre: "RPG",       platform: "PC",       year: 2023, rating: 4.8, icon: "🗡️", color: "#ff5d8f", desc: "RPG de mundo aberto sombrio, com escolhas que mudam o destino de um reino em ruínas." },
  { id: 2,  title: "Corrida Vertigem",     genre: "Corrida",   platform: "PS5",      year: 2022, rating: 4.2, icon: "🏎️", color: "#5fe1c9", desc: "Arcade de corrida frenética por cidades futuristas, com trilha sonora synthwave." },
  { id: 3,  title: "Fragmentos de Aço",    genre: "Ação",      platform: "Xbox",     year: 2021, rating: 4.5, icon: "🤖", color: "#f2b84b", desc: "Hack and slash mecha com combos elaborados e chefes gigantescos a cada capítulo." },
  { id: 4,  title: "Jardim de Pedras",     genre: "Puzzle",    platform: "Switch",   year: 2020, rating: 4.6, icon: "🧩", color: "#8ec5ff", desc: "Quebra-cabeças zen sobre um jardim que se reconstrói conforme você resolve fases." },
  { id: 5,  title: "Sombra da Colheita",   genre: "Terror",    platform: "PC",       year: 2023, rating: 4.0, icon: "🌾", color: "#ff5d8f", desc: "Terror psicológico numa fazenda isolada, onde a colheita exige algo em troca." },
  { id: 6,  title: "Reino de Bolso",       genre: "Estratégia",platform: "Switch",   year: 2019, rating: 4.3, icon: "♟️", color: "#f2b84b", desc: "Construção de reinos em turnos curtos, perfeito para partidas de 15 minutos." },
  { id: 7,  title: "Deriva Estelar",       genre: "Aventura",  platform: "PC",       year: 2024, rating: 4.9, icon: "🛰️", color: "#5fe1c9", desc: "Exploração espacial contemplativa sobre uma tripulação à deriva entre estrelas." },
  { id: 8,  title: "Bloco a Bloco",        genre: "Puzzle",    platform: "Mobile",   year: 2018, rating: 3.9, icon: "🧱", color: "#8ec5ff", desc: "Quebra-cabeças minimalista de encaixe, uma fase nova a cada dia." },
  { id: 9,  title: "Guerreiros do Recife", genre: "Luta",      platform: "PS5",      year: 2022, rating: 4.4, icon: "🥋", color: "#ff5d8f", desc: "Jogo de luta 2D com elenco inspirado em lendas do folclore brasileiro." },
  { id: 10, title: "Última Colheita",      genre: "Simulação", platform: "PC",       year: 2021, rating: 4.1, icon: "🌻", color: "#f2b84b", desc: "Simulador de fazenda relaxante com estações, vizinhos e um mistério subterrâneo." },
  { id: 11, title: "Torre Infinita",       genre: "Ação",      platform: "Mobile",   year: 2020, rating: 3.8, icon: "🗼", color: "#8ec5ff", desc: "Roguelike de andares aleatórios, cada subida é uma corrida diferente." },
  { id: 12, title: "Maré Alta",            genre: "Aventura",  platform: "Switch",   year: 2024, rating: 4.7, icon: "🌊", color: "#5fe1c9", desc: "Aventura cooperativa sobre duas irmãs navegando um arquipélago inundado." },
];

// ---------- State ----------
const state = {
  search: "",
  genre: "all",
  platform: "all",
  sort: "title",
};

// ---------- DOM refs ----------
const grid = document.getElementById("grid");
const emptyState = document.getElementById("emptyState");
const resultInfo = document.getElementById("resultInfo");
const searchInput = document.getElementById("searchInput");
const platformSelect = document.getElementById("platformSelect");
const sortSelect = document.getElementById("sortSelect");
const genreChips = document.getElementById("genreChips");
const countTotal = document.getElementById("countTotal");
const modalOverlay = document.getElementById("modalOverlay");
const modalContent = document.getElementById("modalContent");
const modalClose = document.getElementById("modalClose");
const clearFiltersBtn = document.getElementById("clearFilters");

// ---------- Setup filters ----------
function setupFilters() {
  const genres = ["all", ...new Set(GAMES.map(g => g.genre))];
  const platforms = [...new Set(GAMES.map(g => g.platform))].sort();

  genreChips.innerHTML = genres.map(g =>
    `<button class="chip${g === "all" ? " active" : ""}" data-genre="${g}">${g === "all" ? "Todos os gêneros" : g}</button>`
  ).join("");

  platformSelect.innerHTML = `<option value="all">Todas as plataformas</option>` +
    platforms.map(p => `<option value="${p}">${p}</option>`).join("");

  countTotal.textContent = GAMES.length;
}

// ---------- Star icon ----------
const starSVG = `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>`;

// ---------- Render ----------
function getFiltered() {
  let list = GAMES.filter(g => {
    const matchSearch = g.title.toLowerCase().includes(state.search.toLowerCase());
    const matchGenre = state.genre === "all" || g.genre === state.genre;
    const matchPlatform = state.platform === "all" || g.platform === state.platform;
    return matchSearch && matchGenre && matchPlatform;
  });

  if (state.sort === "title") list.sort((a, b) => a.title.localeCompare(b.title));
  if (state.sort === "year-desc") list.sort((a, b) => b.year - a.year);
  if (state.sort === "rating-desc") list.sort((a, b) => b.rating - a.rating);

  return list;
}

function render() {
  const list = getFiltered();

  resultInfo.textContent = `${list.length} ${list.length === 1 ? "jogo encontrado" : "jogos encontrados"}`;
  emptyState.classList.toggle("hidden", list.length !== 0);
  grid.classList.toggle("hidden", list.length === 0);

  grid.innerHTML = list.map(g => `
    <article class="card" style="--card-color:${g.color}" data-id="${g.id}" tabindex="0">
      <div class="card__cover">${g.icon}</div>
      <div class="card__genre">${g.genre}</div>
      <h3 class="card__title">${g.title}</h3>
      <div class="card__meta">
        <span>${g.platform} · ${g.year}</span>
        <span class="card__rating">${starSVG}${g.rating.toFixed(1)}</span>
      </div>
    </article>
  `).join("");
}

// ---------- Modal ----------
function openModal(id) {
  const g = GAMES.find(item => item.id === id);
  if (!g) return;

  modalContent.innerHTML = `
    <div class="modal__cover" style="--card-color:${g.color}">${g.icon}</div>
    <div class="modal__genre">${g.genre}</div>
    <h2 class="modal__title">${g.title}</h2>
    <div class="modal__tags">
      <span class="modal__tag">${g.platform}</span>
      <span class="modal__tag">${g.year}</span>
    </div>
    <p class="modal__desc">${g.desc}</p>
    <div class="modal__footer">
      <span class="modal__rating">${starSVG}${g.rating.toFixed(1)} / 5</span>
    </div>
  `;
  modalOverlay.querySelector(".modal").style.setProperty("--card-color", g.color);
  modalOverlay.classList.remove("hidden");
}

function closeModal() {
  modalOverlay.classList.add("hidden");
}

// ---------- Events ----------
searchInput.addEventListener("input", e => {
  state.search = e.target.value;
  render();
});

platformSelect.addEventListener("change", e => {
  state.platform = e.target.value;
  render();
});

sortSelect.addEventListener("change", e => {
  state.sort = e.target.value;
  render();
});

genreChips.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  state.genre = chip.dataset.genre;
  [...genreChips.children].forEach(c => c.classList.toggle("active", c === chip));
  render();
});

grid.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  openModal(Number(card.dataset.id));
});

grid.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const card = e.target.closest(".card");
  if (!card) return;
  openModal(Number(card.dataset.id));
});

clearFiltersBtn.addEventListener("click", () => {
  state.search = "";
  state.genre = "all";
  state.platform = "all";
  searchInput.value = "";
  platformSelect.value = "all";
  [...genreChips.children].forEach(c => c.classList.toggle("active", c.dataset.genre === "all"));
  render();
});

modalClose.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", e => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

// ---------- Init ----------
setupFilters();
render();

</script>
</body>
</html>
