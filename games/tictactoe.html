<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha — PlayHub</title>
<script src="../assets/icons.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='rgb(15,23,42)'/><g fill='none' stroke='rgb(37,99,235)' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'><rect x='20' y='62' width='60' height='24' rx='10'/><path d='M50 62V32'/><circle cx='50' cy='20' r='10'/></g><circle cx='33' cy='75' r='4' fill='rgb(34,197,94)'/><circle cx='67' cy='75' r='4' fill='rgb(34,197,94)'/></svg>">
<script src="../assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/sfx.js" defer></script>
<script src="../assets/pwa.js" defer></script>
<script src="../assets/share.js" defer></script>
<style>
  .board {
    display: grid;
    grid-template-columns: repeat(3, 90px);
    grid-template-rows: repeat(3, 90px);
    gap: 8px;
  }
  .cell {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 2.4rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.15s;
    user-select: none;
  }
  .cell:hover { background: var(--card-hover); }
  .cell.x { color: var(--accent3); }
  .cell.o { color: var(--accent2); }
  #status { font-size: 1.1rem; font-weight: 600; min-height: 1.6em; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="dot"></span>Play<span class="grad">Hub</span></a>
    <div class="header-actions">
      <a class="back-link" href="../about.html">Sobre</a>
      <a class="back-link" href="../index.html"><svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Voltar ao início</a>
    </div>
  </header>

  <main>
    <div class="game-shell">
      <h1><svg class="h1-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v16M15 4v16M4 9h16M4 15h16"/><path d="M5.3 5.3l2.4 2.4M7.7 5.3l-2.4 2.4"/><circle cx="18" cy="18" r="2" fill="currentColor" fill-opacity="0.3"/></svg>Jogo da Velha</h1>
      <div class="panel">
        <div id="status">Vez do jogador <strong>X</strong></div>
        <div class="board" id="board"></div>
        <div class="hud">
          <div>X venceu: <strong id="scoreX">0</strong></div>
          <div>O venceu: <strong id="scoreO">0</strong></div>
          <div>Empates: <strong id="scoreD">0</strong></div>
        </div>
        <div class="controls-row">
          <button class="btn" id="resetBtn">Nova partida</button>
          <button class="btn secondary" id="clearScoreBtn">Zerar placar</button>
          <button class="btn secondary" id="shareBtn"><svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Compartilhar</button>
        </div>
      </div>
      <p class="hint">Dois jogadores no mesmo dispositivo. Clique em uma célula vazia para jogar.</p>
    </div>
  </main>

  <footer>Feito com HTML, CSS e JavaScript puros · PlayHub</footer>

<script>
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const resetBtn = document.getElementById('resetBtn');
const clearScoreBtn = document.getElementById('clearScoreBtn');
const scoreXEl = document.getElementById('scoreX');
const scoreOEl = document.getElementById('scoreO');
const scoreDEl = document.getElementById('scoreD');

let board, current, active;
let scores = JSON.parse(localStorage.getItem('tictactoe_scores') || '{"X":0,"O":0,"D":0}');

const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function init() {
  board = Array(9).fill(null);
  current = 'X';
  active = true;
  render();
  updateScores();
  statusEl.innerHTML = `Vez do jogador <strong>${current}</strong>`;
}

function render() {
  boardEl.innerHTML = '';
  board.forEach((val, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (val ? ' ' + val.toLowerCase() : '');
    cell.textContent = val || '';
    cell.addEventListener('click', () => play(i));
    boardEl.appendChild(cell);
  });
}

function play(i) {
  if (!active || board[i]) return;
  board[i] = current;
  SFX.click();
  render();

  const winLine = WIN_LINES.find(line => line.every(idx => board[idx] === current));
  if (winLine) {
    active = false;
    scores[current]++;
    updateScores();
    SFX.win();
    statusEl.innerHTML = `<svg class="icon-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.7 6 6.6.6-5 4.5 1.5 6.4L12 16.8 6.2 20l1.5-6.4-5-4.5 6.6-.6L12 2.5z"/></svg>Jogador <strong>${current}</strong> venceu!`;
    return;
  }

  if (board.every(c => c)) {
    active = false;
    scores.D++;
    updateScores();
    SFX.error();
    statusEl.textContent = 'Empate!';
    return;
  }

  current = current === 'X' ? 'O' : 'X';
  statusEl.innerHTML = `Vez do jogador <strong>${current}</strong>`;
}

function updateScores() {
  scoreXEl.textContent = scores.X;
  scoreOEl.textContent = scores.O;
  scoreDEl.textContent = scores.D;
  localStorage.setItem('tictactoe_scores', JSON.stringify(scores));
}

function clearScores() {
  scores = { X: 0, O: 0, D: 0 };
  updateScores();
}

resetBtn.addEventListener('click', init);
clearScoreBtn.addEventListener('click', clearScores);
document.getElementById('shareBtn').addEventListener('click', () => {
  SHARE.score(`Joguei Jogo da Velha no PlayHub! Placar: X ${scores.X} x ${scores.O} O (${scores.D} empates)`);
});
init();
</script>
</body>
</html>
