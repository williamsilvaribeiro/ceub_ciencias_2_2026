<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — PlayHub</title>
<script src="../assets/icons.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='rgb(15,23,42)'/><g fill='none' stroke='rgb(37,99,235)' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'><rect x='20' y='62' width='60' height='24' rx='10'/><path d='M50 62V32'/><circle cx='50' cy='20' r='10'/></g><circle cx='33' cy='75' r='4' fill='rgb(34,197,94)'/><circle cx='67' cy='75' r='4' fill='rgb(34,197,94)'/></svg>">
<script src="../assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/sfx.js" defer></script>
<script src="../assets/pwa.js" defer></script>
<script src="../assets/share.js" defer></script>
<style>
  canvas {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-width: 100%;
  }
  #overlay {
    position: relative;
  }
  #gameOverMsg {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.8rem;
    background: rgba(15, 16, 32, 0.85);
    border-radius: 10px;
    font-weight: 700;
    font-size: 1.3rem;
    text-align: center;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(3, 50px);
    gap: 6px;
    margin-top: 0.5rem;
  }
  .dpad button {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .dpad button:hover { background: var(--card-hover); }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="dot"></span>Play<span class="grad">Hub</span></a>
    <div class="header-actions">
      <a class="back-link" href="../about.html">Sobre</a>
      <a class="back-link" href="../index.html"><svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Voltar ao início</a>
    </div>
  </header>

  <main>
    <div class="game-shell">
      <h1><svg class="h1-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7c0-1.7 1.3-3 3-3s3 1.3 3 3-1.3 3-3 3-3 1.3-3 3 1.3 3 3 3h9" fill="currentColor" fill-opacity="0.12"/><path d="M4 7c0-1.7 1.3-3 3-3s3 1.3 3 3-1.3 3-3 3-3 1.3-3 3 1.3 3 3 3h9"/><circle cx="19" cy="6" r="1.4" fill="currentColor" stroke="none"/></svg>Snake</h1>
      <div class="panel">
        <div class="hud">
          <div>Pontos: <strong id="score">0</strong></div>
          <div>Recorde: <strong id="best">0</strong></div>
        </div>
        <div id="overlay">
          <canvas id="canvas" width="400" height="400"></canvas>
          <div id="gameOverMsg">
            <div id="gameOverText">Fim de jogo!</div>
            <button class="btn" id="restartBtn">Jogar novamente</button>
          </div>
        </div>
        <div class="dpad">
          <button id="up"><svg class="icon-inline" style="margin:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
          <button id="left"><svg class="icon-inline" style="margin:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button id="down"><svg class="icon-inline" style="margin:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button id="right"><svg class="icon-inline" style="margin:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <div class="controls-row">
          <button class="btn secondary" id="shareBtn"><svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Compartilhar</button>
        </div>
      </div>
      <p class="hint">Use as setas do teclado (ou os botões acima) para mover. Coma as maçãs vermelhas para crescer.</p>
    </div>
  </main>

  <footer>Feito com HTML, CSS e JavaScript puros · PlayHub</footer>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const gameOverMsg = document.getElementById('gameOverMsg');
const gameOverText = document.getElementById('gameOverText');
const restartBtn = document.getElementById('restartBtn');

const GRID = 20;
const CELLS = canvas.width / GRID;
let snake, dir, nextDir, food, score, best, running, loopId;

best = Number(localStorage.getItem('snake_best') || 0);
bestEl.textContent = best;

function init() {
  snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  running = true;
  scoreEl.textContent = score;
  gameOverMsg.style.display = 'none';
  placeFood();
  if (loopId) clearInterval(loopId);
  loopId = setInterval(tick, 110);
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS || snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    SFX.match();
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#1f1829';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.shadowColor = '#dc2626';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  snake.forEach((seg, i) => {
    ctx.save();
    if (i === 0) {
      ctx.shadowColor = '#2563eb';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#2563eb';
    } else {
      ctx.fillStyle = '#22c55e';
    }
    ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
    ctx.restore();
  });
}

function gameOver() {
  running = false;
  clearInterval(loopId);
  SFX.gameover();
  if (score > best) {
    best = score;
    localStorage.setItem('snake_best', best);
    bestEl.textContent = best;
  }
  gameOverText.textContent = `Fim de jogo! Pontuação: ${score}`;
  gameOverMsg.style.display = 'flex';
}

function setDir(x, y) {
  if (!running) return;
  if (dir.x === -x && dir.y === -y) return;
  nextDir = { x, y };
}

window.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp': case 'w': setDir(0, -1); e.preventDefault(); break;
    case 'ArrowDown': case 's': setDir(0, 1); e.preventDefault(); break;
    case 'ArrowLeft': case 'a': setDir(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': setDir(1, 0); e.preventDefault(); break;
  }
});

document.getElementById('up').addEventListener('click', () => setDir(0, -1));
document.getElementById('down').addEventListener('click', () => setDir(0, 1));
document.getElementById('left').addEventListener('click', () => setDir(-1, 0));
document.getElementById('right').addEventListener('click', () => setDir(1, 0));
restartBtn.addEventListener('click', init);
document.getElementById('shareBtn').addEventListener('click', () => {
  SHARE.score(`Fiz ${score} pontos no Snake do PlayHub! (recorde: ${best})`);
});

init();
draw();
</script>
</body>
</html>
