<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — PlayHub</title>
<script src="../assets/icons.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='rgb(15,23,42)'/><g fill='none' stroke='rgb(37,99,235)' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'><rect x='20' y='62' width='60' height='24' rx='10'/><path d='M50 62V32'/><circle cx='50' cy='20' r='10'/></g><circle cx='33' cy='75' r='4' fill='rgb(34,197,94)'/><circle cx='67' cy='75' r='4' fill='rgb(34,197,94)'/></svg>">
<script src="../assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/sfx.js" defer></script>
<script src="../assets/pwa.js" defer></script>
<script src="../assets/share.js" defer></script>
<style>
  .grid2048 {
    position: relative;
    width: min(360px, 88vw);
    aspect-ratio: 1;
    background: var(--bg-alt);
    border-radius: 10px;
    border: 1px solid var(--border);
    box-sizing: border-box;
  }
  .tile-bg {
    position: absolute;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 8px;
  }
  .tile {
    position: absolute;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 4px 10px rgba(0, 0, 0, 0.35);
    transition: top 0.1s ease, left 0.1s ease;
    animation: tile-pop 0.14s ease-out;
  }
  @keyframes tile-pop {
    from { transform: scale(0.82); opacity: 0.5; }
    to { transform: scale(1); opacity: 1; }
  }
  #overlay2048 {
    position: relative;
  }
  #resultMsg {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.8rem;
    background: rgba(15, 23, 42, 0.92);
    border-radius: 10px;
    font-family: var(--font-display);
    font-size: 0.85rem;
    line-height: 1.6;
    text-align: center;
    padding: 1rem;
    z-index: 20;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(3, 50px);
    gap: 6px;
  }
  .dpad button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .dpad button:hover { background: var(--card-hover); border-color: var(--accent); }
  .dpad #up2048 { grid-column: 2; grid-row: 1; }
  .dpad #left2048 { grid-column: 1; grid-row: 2; }
  .dpad #down2048 { grid-column: 2; grid-row: 2; }
  .dpad #right2048 { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="dot"></span>Play<span class="grad">Hub</span></a>
    <div class="header-actions">
      <a class="back-link" href="../about.html">Sobre</a>
      <a class="back-link" href="../index.html"><svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Voltar ao início</a>
    </div>
  </header>

  <main>
    <div class="game-shell">
      <h1><svg class="h1-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2.5" y="2.5" width="8" height="8" rx="1.8"/><rect x="13.5" y="2.5" width="8" height="8" rx="1.8" fill="currentColor" fill-opacity="0.25"/><rect x="2.5" y="13.5" width="8" height="8" rx="1.8" fill="currentColor" fill-opacity="0.25"/><rect x="13.5" y="13.5" width="8" height="8" rx="1.8"/></svg>2048</h1>
      <div class="panel">
        <div class="hud">
          <div>Pontos: <strong id="score">0</strong></div>
          <div>Recorde: <strong id="best">0</strong></div>
        </div>
        <div id="overlay2048">
          <div class="grid2048" id="grid"></div>
          <div id="resultMsg">
            <div id="resultText"></div>
            <button class="btn" id="restartBtn">Jogar novamente</button>
          </div>
        </div>
        <div class="dpad">
          <button id="up2048"><svg class="icon-inline" style="margin:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
          <button id="left2048"><svg class="icon-inline" style="margin:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button id="down2048"><svg class="icon-inline" style="margin:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button id="right2048"><svg class="icon-inline" style="margin:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <div class="controls-row">
          <button class="btn secondary" id="newGameBtn">Reiniciar</button>
          <button class="btn secondary" id="shareBtn"><svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Compartilhar</button>
        </div>
      </div>
      <p class="hint">Use as setas do teclado, os botões acima, ou arraste no celular para mover todas as peças. Peças iguais se combinam ao colidir.</p>
    </div>
  </main>

  <footer>Feito com HTML, CSS e JavaScript puros · PlayHub</footer>

<script>
const gridEl = document.getElementById('grid');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const resultMsg = document.getElementById('resultMsg');
const resultText = document.getElementById('resultText');
const restartBtn = document.getElementById('restartBtn');
const newGameBtn = document.getElementById('newGameBtn');

const SIZE = 4;
let board, score, best, won, over;

// Responsive layout: everything positioned in % of the container, so the
// board scales cleanly on any screen instead of overflowing on mobile.
const OUTER_PCT = 3;
const GAP_PCT = 3;
const CELL_PCT = (100 - 2 * OUTER_PCT - (SIZE - 1) * GAP_PCT) / SIZE;

function cellRect(r, c) {
  return {
    top: (OUTER_PCT + r * (CELL_PCT + GAP_PCT)) + '%',
    left: (OUTER_PCT + c * (CELL_PCT + GAP_PCT)) + '%',
    size: CELL_PCT + '%'
  };
}

const COLORS = {
  2: '#334155', 4: '#475569', 8: '#2563eb', 16: '#3b82f6',
  32: '#7c3aed', 64: '#a855f7', 128: '#f97316', 256: '#fb923c',
  512: '#dc2626', 1024: '#22c55e', 2048: '#facc15'
};
const DARK_TEXT_TILES = new Set([128, 256, 1024, 2048]);

best = Number(localStorage.getItem('2048_best') || 0);
bestEl.textContent = best;

function buildBackground() {
  gridEl.querySelectorAll('.tile-bg').forEach(e => e.remove());
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const rect = cellRect(r, c);
      const bg = document.createElement('div');
      bg.className = 'tile-bg';
      bg.style.top = rect.top;
      bg.style.left = rect.left;
      bg.style.width = rect.size;
      bg.style.height = rect.size;
      gridEl.appendChild(bg);
    }
  }
}

function init() {
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  score = 0;
  won = false;
  over = false;
  scoreEl.textContent = score;
  resultMsg.style.display = 'none';
  buildBackground();
  addRandomTile();
  addRandomTile();
  render();
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (board[r][c] === 0) empty.push([r, c]);
  if (empty.length === 0) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  gridEl.querySelectorAll('.tile').forEach(e => e.remove());
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const val = board[r][c];
      if (!val) continue;
      const rect = cellRect(r, c);
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = val;
      tile.style.top = rect.top;
      tile.style.left = rect.left;
      tile.style.width = rect.size;
      tile.style.height = rect.size;
      tile.style.background = COLORS[val] || '#222';
      tile.style.color = DARK_TEXT_TILES.has(val) ? '#1a1a2e' : '#ffffff';
      tile.style.fontSize = val >= 1000 ? 'clamp(0.75rem, 4.2vw, 1.15rem)' : 'clamp(0.9rem, 5.5vw, 1.6rem)';
      gridEl.appendChild(tile);
    }
  }
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('2048_best', best);
    bestEl.textContent = best;
  }
}

function slideRow(row) {
  let arr = row.filter(v => v !== 0);
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i + 1]) {
      arr[i] *= 2;
      score += arr[i];
      if (arr[i] === 2048) won = true;
      arr.splice(i + 1, 1);
    }
  }
  while (arr.length < SIZE) arr.push(0);
  return arr;
}

function rotateBoard(times) {
  for (let t = 0; t < times; t++) {
    const newBoard = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        newBoard[c][SIZE - 1 - r] = board[r][c];
    board = newBoard;
  }
}

function move(direction) {
  if (over) return;
  // Normalize to "left" by rotating, then rotate back
  const rotations = { left: 0, up: 1, right: 2, down: 3 };
  const backRotations = { left: 0, up: 3, right: 2, down: 1 };

  rotateBoard(rotations[direction]);

  let moved = false;
  const before = JSON.stringify(board);
  const scoreBefore = score;
  board = board.map(row => slideRow(row));
  if (JSON.stringify(board) !== before) moved = true;

  rotateBoard(backRotations[direction]);

  if (moved) {
    if (score > scoreBefore) SFX.match(); else SFX.move();
    addRandomTile();
    render();
    if (won) {
      SFX.win();
      showResult('VOCÊ ALCANÇOU 2048!', true);
      return;
    }
    if (!hasMoves()) {
      over = true;
      SFX.gameover();
      showResult('FIM DE JOGO! SEM MOVIMENTOS POSSÍVEIS.');
    }
  }
}

function hasMoves() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return true;
      if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return true;
      if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return true;
    }
  }
  return false;
}

function showResult(text, isWin) {
  resultText.innerHTML = isWin
    ? `<svg class="icon-inline" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.7 6 6.6.6-5 4.5 1.5 6.4L12 16.8 6.2 20l1.5-6.4-5-4.5 6.6-.6L12 2.5z"/></svg>${text}`
    : text;
  resultMsg.style.display = 'flex';
}

window.addEventListener('keydown', (e) => {
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (map[e.key]) {
    e.preventDefault();
    move(map[e.key]);
  }
});

document.getElementById('up2048').addEventListener('click', () => move('up'));
document.getElementById('down2048').addEventListener('click', () => move('down'));
document.getElementById('left2048').addEventListener('click', () => move('left'));
document.getElementById('right2048').addEventListener('click', () => move('right'));

// Touch swipe support
let touchStartX = 0, touchStartY = 0;
gridEl.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
gridEl.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 'right' : 'left');
  } else if (Math.abs(dy) > 20 || Math.abs(dx) > 20) {
    move(dy > 0 ? 'down' : 'up');
  }
});

restartBtn.addEventListener('click', init);
newGameBtn.addEventListener('click', init);
document.getElementById('shareBtn').addEventListener('click', () => {
  const maxTile = Math.max(0, ...board.flat());
  SHARE.score(`Cheguei ao bloco ${maxTile} com ${score} pontos no 2048 do PlayHub! (recorde: ${best})`);
});

init();
</script>
</body>
</html>
